name: AURA Experiment - Requests-HTML (Repo 22)

on:
  workflow_dispatch:

jobs:
  modernize-requests-html:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🛠️ Setup Agent Deps & System Browser
        # These libraries are required for the Headless Chromium browser to launch
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2
          pip install google-genai google-api-core pypi-simple packaging pip-tools

      - name: 🧪 1. Run Pip Baseline (2022 State)
        run: |
          python -m venv baseline_env
          ./baseline_env/bin/pip install -r requirements.txt
          ./baseline_env/bin/pip install -e .
          # Run the native test suite
          ./baseline_env/bin/python -m pytest tests/test_requests_html.py

      - name: 💥 2. Run Pip Upgrade (The Attack)
        continue-on-error: true
        run: |
          python -m venv upgrade_env
          # Pip will grab urllib3 2.x here, breaking the launch logic
          ./upgrade_env/bin/pip install --upgrade -r primary_requirements.txt
          ./upgrade_env/bin/pip install -e .
          # This should fail with a TypeError in the browser launch
          ./upgrade_env/bin/python -m pytest tests/test_requests_html.py

      - name: 🤖 3. Run AURA Agent (The Healing Pass)
        run: |
          python -u dependency_agent.py | tee aura_requests_execution.log
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 📝 Save Execution Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-requests-html-log
          path: aura_requests_execution.log

      - name: 💾 Commit Final Results
        if: always()
        run: |
          git config --global user.name 'AURA Agent'
          git config --global user.email 'aura-agent@users.noreply.github.com'
          git add requirements.txt aura_requests_execution.log
          if ! git diff --staged --quiet; then
            git commit -m "🤖 [ASE-2026] Final Modernization: Requests-HTML [skip ci]"
            git push
          fi